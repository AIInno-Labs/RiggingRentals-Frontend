# Deploy to Vercel (production) on push to main.
#
# One-time setup before this can run — add these as GitHub repo secrets
# (Settings → Secrets and variables → Actions):
#
#   Vercel project/auth (required):
#     VERCEL_TOKEN       — Vercel dashboard → Account Settings → Tokens
#     VERCEL_ORG_ID      — from `npx vercel link` locally → .vercel/project.json,
#     VERCEL_PROJECT_ID    or Vercel dashboard → Project Settings → General
#
#   App env vars (see .env.local.example for what each does):
#     NEXT_PUBLIC_SUPABASE_URL          — required
#     NEXT_PUBLIC_SUPABASE_ANON_KEY     — required
#     NEXT_PUBLIC_APP_URL               — optional
#     RESEND_API_KEY                    — optional (falls back to mailto)
#     RESEND_FROM_EMAIL                 — optional
#     SUPER_ADMIN_API_MODE              — mock | rigg-rental (should be rigg-rental for a real deploy)
#     RIGG_RENTAL_API_URL               — only used when mode=rigg-rental
#
# RIGG_RENTAL_SUPERADMIN_EMAIL/PASSWORD are deliberately not set here — the
# rigg-rental adapter falls back to the backend's seeded default credentials
# (superadmin@rigg-rental.local / superadmin123) when they're absent. Add
# them as secrets (and reference below) if the deployed backend's Super
# Admin password is ever changed from that default.
#
# These are passed directly into `vercel build` below rather than configured
# in the Vercel dashboard, so everything this deploy needs lives in one place
# (GitHub secrets) and is visible in this file. The tradeoff: a `vercel
# deploy` run from someone's laptop, outside this workflow, won't see them.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Links this checkout to the Vercel project (writes .vercel/project.json)
      # and fetches build settings — not app secrets, those come from GitHub
      # below instead.
      - name: Link Vercel project
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SUPER_ADMIN_API_MODE: ${{ secrets.SUPER_ADMIN_API_MODE }}
          RIGG_RENTAL_API_URL: ${{ secrets.RIGG_RENTAL_API_URL }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
