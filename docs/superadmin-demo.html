<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rigging Rentals Super Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tokens copied from src/app/globals.css (Rigging Rentals brand: yellow + black + cool neutrals) */
:root{
  --brand:#f5d400; --brand-ink:#111111;
  --background:#f4f4f5; --foreground:#111111; --card:#ffffff;
  --secondary:#e4e4e7; --muted:#ececef; --muted-fg:#52525b;
  --destructive:#b42318; --border:#d4d4d8; --border-soft:#e4e4e7;
  --side:#111111; --side-border:#27272a; --side-fg:#fafafa; --side-muted:#a1a1aa; --side-item:#d4d4d8;
  --radius:8px;
  --display:"Barlow Condensed",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  color:var(--foreground);font-family:var(--body);font-size:14px;line-height:1.45;
  background-color:var(--background);
  background-image:linear-gradient(180deg,#fafafa 0%,#f4f4f5 55%,#eeeef0 100%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{max-width:100%}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.02em;margin:0;font-weight:600}
p{margin:0}
a{color:inherit}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted-fg)}
.small{font-size:12.5px}
.brand-link{color:#111;text-underline-offset:3px;text-decoration:none;font-weight:500}
.brand-link:hover{text-decoration-line:underline;text-decoration-color:var(--brand);text-decoration-thickness:2px}
@keyframes rise-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.anim-rise{animation:rise-in .4s ease-out both}
.steel-panel{background:#fff;border:1px solid rgb(212 212 216 / .95);box-shadow:0 1px 0 rgb(255 255 255 / .9) inset,0 8px 24px rgb(17 17 17 / .04)}

/* ---------- shell (mirrors components/portal-shell.tsx + role-nav.tsx) ---------- */
.app{min-height:100vh;display:flex}
.side{position:sticky;top:0;height:100vh;width:224px;flex-shrink:0;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--side-border);padding:16px 12px;color:var(--side-fg)}
.side .brand{display:block;margin-bottom:24px;padding:0 4px;border-radius:2px}
.side .brand img{height:36px;width:auto;display:block}
.side nav{display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.side .grp{display:grid;gap:2px}
.side .sec{padding:6px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.025em;color:var(--side-muted)}
.side .sec.on{color:var(--brand)}
.side a.item{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:500;color:var(--side-item);text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
.side a.item.nested{padding-left:20px}
.side a.item:hover{background:rgb(255 255 255 / .1);color:#fff}
.side a.item.on{background:var(--brand);color:#111}
.nbadge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--brand);color:#111}
.side a.item.on .nbadge{background:#111;color:var(--brand)}
.side .who{margin-top:auto;border-top:1px solid var(--side-border);padding-top:12px}
.side .who .nm{padding:0 8px;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .who .rl{padding:0 8px;margin-bottom:8px;font-size:12px;color:var(--side-muted)}
.btn.side-out{width:100%;background:transparent;border-color:#3f3f46;color:var(--side-fg)}
.btn.side-out:hover{background:#27272a;color:var(--brand)}
.side .demo{margin-top:8px;padding:0 8px;font-size:11px;color:#71717a}

.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;background:#111;color:var(--side-fg);border-bottom:1px solid var(--side-border)}
.top .stripe{height:4px;background:var(--brand)}
.top .row{display:flex;align-items:center;gap:12px;padding:8px 24px}
.top .mlogo{display:none;flex-shrink:0}
.top .mlogo img{height:32px;width:auto;display:block}
.top h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .find{flex:1;min-width:0;max-width:320px}
.top .find input{height:36px;width:100%;border-radius:8px;border:1px solid #3f3f46;background:#1a1a1a;color:#fafafa;padding:4px 10px;outline:none}
.top .find input::placeholder{color:#71717a}
.top .find input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgb(245 212 0 / .5)}
.top .hdr-btn{background:var(--brand);color:#111;border-color:transparent}
.top .hdr-btn:hover{background:#e6c600}
.top .out{display:none;background:transparent;border-color:#3f3f46;color:#fafafa}
.top .out:hover{background:#27272a}
main{width:100%;max-width:1280px;margin:0 auto;padding:24px 24px 32px;min-width:0;overflow-x:clip}
.bnav{display:none}

/* ---------- page heading ---------- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.ph .eyebrow{font-size:14px;font-weight:500;color:var(--muted-fg)}
.ph h2{font-size:24px;line-height:1.15}
.ph .desc{margin-top:4px;font-size:14px;color:var(--muted-fg);max-width:680px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- hero + pulse tiles (mirrors OpsCommandCenter) ---------- */
.hero{border-radius:16px;padding:20px;margin-bottom:16px}
.hero .eyebrow{font-size:14px;font-weight:500;color:var(--muted-fg)}
.hero h2{font-size:30px;line-height:1.1}
.hero .desc{margin-top:4px;max-width:576px;font-size:14px;color:var(--muted-fg)}
.hero .links{display:flex;flex-wrap:wrap;gap:8px;font-size:14px}
.tiles{margin-top:16px;display:grid;gap:8px;grid-template-columns:repeat(5,minmax(0,1fr))}
.tile{display:block;text-decoration:none;color:inherit;border-radius:16px;border:1px solid var(--border-soft);background:#fff;padding:16px;transition:transform .15s,border-color .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);border-color:rgb(245 212 0 / .7);box-shadow:0 4px 6px -1px rgb(0 0 0 / .1),0 2px 4px -2px rgb(0 0 0 / .1)}
.tile.alert{border-color:rgb(180 35 24 / .3)}
.tile.warn{border-color:rgb(245 212 0 / .5)}
.tile .k{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.025em;color:var(--muted-fg)}
.tile .v{margin-top:4px;font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{margin-top:4px;font-size:12px;color:var(--muted-fg)}
.tile:hover .s{color:#111}

/* ---------- cards ---------- */
.card{border-radius:16px;overflow:hidden}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:16px 16px 12px;border-bottom:1px solid var(--border-soft)}
.card-h h3{font-size:18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-h .sub{font-size:12px;color:var(--muted-fg)}
.card-b{padding:16px}
.card-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border-soft);background:rgb(236 236 239 / .5)}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.stack{display:grid;gap:12px;align-content:start}

/* ---------- table (shadcn ui/table) ---------- */
.tw{overflow-x:auto;padding:0 8px 8px}
table.t{width:100%;border-collapse:collapse;font-size:14px;caption-side:bottom}
.t th{height:40px;padding:0 8px;text-align:left;vertical-align:middle;font-weight:500;color:#111;white-space:nowrap;border-bottom:1px solid var(--border)}
.t td{padding:8px;vertical-align:middle;border-bottom:1px solid var(--border-soft)}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:rgb(236 236 239 / .5)}
.t tr.dim td{opacity:.55}
.t .num{text-align:right;font-variant-numeric:tabular-nums}
.who b{display:block;font-weight:500}
.who span{font-size:12.5px;color:var(--muted-fg)}

/* ---------- badges (shadcn ui/badge + components/status-pill.tsx tones) ---------- */
.chip,.pill{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:20px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);background:#fff;color:#111;font-size:12px;font-weight:500;white-space:nowrap;margin:2px 4px 2px 0;vertical-align:middle}
.chip.dark{background:#111;color:var(--brand);border-color:#111}
.chip.y{background:var(--brand);color:#111;border-color:transparent}
.pill.ok{background:#d1fae5;color:#022c22;border-color:rgb(4 120 87 / .4)}
.pill.off{background:#fff;color:#71717a;border-color:var(--border)}
.pill.warn{background:#fef3c7;color:#451a03;border-color:rgb(180 83 9 / .5)}
.pill.bad{background:#b42318;color:#fff;border-color:#b42318}
.type{display:inline-flex;align-items:center;height:20px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);font-size:12px;font-weight:500;white-space:nowrap;vertical-align:middle}
.type.MENU{background:#e0f2fe;color:#082f49;border-color:rgb(3 105 161 / .4)}
.type.ACTION{background:#f4f4f5;color:#3f3f46;border-color:var(--border)}
.type.FIELD{background:#ede9fe;color:#2e1065;border-color:rgb(109 40 217 / .4)}

/* ---------- buttons (shadcn ui/button) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:#111;font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s,border-color .15s;outline:none;text-decoration:none}
.btn:hover{background:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{border-color:var(--brand);box-shadow:0 0 0 3px rgb(245 212 0 / .5)}
.btn.primary{background:var(--brand);border-color:transparent;color:#111}
.btn.primary:hover{background:rgb(245 212 0 / .8)}
.btn.dark{background:#1a1a1a;border-color:transparent;color:var(--brand)}
.btn.dark:hover{background:#000}
.btn.danger{background:rgb(180 35 24 / .1);border-color:transparent;color:var(--destructive)}
.btn.danger:hover{background:rgb(180 35 24 / .2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--muted)}
.btn.sm{height:28px;padding:0 10px;font-size:12.8px;border-radius:6.4px}
.btn.lg{height:40px}
.btn:disabled{opacity:.5;pointer-events:none}

/* ---------- forms ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input{height:32px;width:100%;min-width:0;border-radius:8px;border:1px solid var(--border);background:#fff;padding:4px 10px;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;padding:8px 10px;resize:vertical}
.input::placeholder{color:var(--muted-fg)}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgb(245 212 0 / .5)}
.input:disabled{background:rgb(212 212 216 / .5);opacity:.6;cursor:not-allowed}
.toolbar .input{height:36px;width:auto;min-width:150px}
.toolbar .search{flex:1 1 220px;max-width:384px}
.f{display:grid;gap:8px;margin-bottom:14px}
.f label{font-size:14px;font-weight:500;line-height:1}
.f .hint{font-size:12px;color:var(--muted-fg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fsec{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.02em;margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border-soft)}
.fsec:first-child{margin-top:0}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.check{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--border-soft);border-radius:8px;background:#fff;cursor:pointer;transition:border-color .15s,background .15s}
.check:hover{border-color:var(--border)}
.check input{margin-top:3px;accent-color:var(--brand);width:15px;height:15px}
.check.on{border-color:rgb(245 212 0 / .8);background:rgb(245 212 0 / .08)}
.check small{display:block;color:var(--muted-fg);font-size:11.5px}
.form-err{color:var(--destructive);font-size:14px}
.form-err:not(:empty){margin-bottom:12px}
.note{border-radius:8px;border:1px solid rgb(245 212 0 / .5);background:rgb(245 212 0 / .08);padding:10px 12px;font-size:13px}
.note.grey{border-color:var(--border-soft);background:#fafafa}
/* segmented control / tabs (shadcn ui/tabs list) */
.seg,.tabs{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:8px;background:var(--muted);max-width:100%;overflow-x:auto}
.seg button,.tabs button{height:28px;padding:0 10px;border:1px solid transparent;border-radius:6px;background:none;color:var(--muted-fg);font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button:hover,.tabs button:hover{color:#111}
.seg button.on,.tabs button.on{background:#fff;color:#111;box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.tabs{margin-bottom:16px}

/* ---------- scope bar (Platform / Organization) ---------- */
.scopebar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;border-radius:16px;padding:12px 16px;margin-bottom:16px}
.scopebar .sf{display:grid;gap:6px;min-width:0}
.scopebar .lbl{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.025em;color:var(--muted-fg);line-height:1}
.scopebar select.input{height:36px;width:280px}
.scopebar .scope-note{flex:1 1 240px;font-size:12.5px;color:var(--muted-fg);padding-bottom:8px}
.secret{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em}

/* ---------- dialog (shadcn ui/dialog) ---------- */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgb(0 0 0 / .1);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.drawer{width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column;background:#fff;border-radius:12px;box-shadow:0 0 0 1px rgb(17 17 17 / .1),0 20px 50px rgb(0 0 0 / .15);overflow:hidden;animation:rise-in .2s ease-out both}
.drawer-h{position:relative;padding:16px 48px 12px 16px;border-bottom:1px solid var(--border-soft)}
.drawer-h h2{font-size:22px}
.drawer-h .sub{margin-top:2px;font-size:13px;color:var(--muted-fg)}
.drawer-b{padding:16px;overflow-y:auto;flex:1}
.drawer-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border-soft);background:rgb(236 236 239 / .5);flex-wrap:wrap}
.x{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:6px;border:0;background:none;cursor:pointer;font-size:14px;color:var(--muted-fg)}
.x:hover{background:var(--muted);color:#111}
.x.inline{position:static;flex-shrink:0}
.modal{width:min(440px,100%);background:#fff;border-radius:12px;padding:16px;box-shadow:0 0 0 1px rgb(17 17 17 / .1),0 20px 50px rgb(0 0 0 / .15);animation:rise-in .2s ease-out both}
.modal h3{font-size:22px;margin-bottom:6px}
.modal p{margin-bottom:16px;color:#3f3f46;font-size:14px}

/* ---------- toasts (sonner) ---------- */
#toasts{position:fixed;bottom:16px;right:16px;z-index:80;display:grid;gap:8px;width:min(356px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;background:#fff;color:#111;border:1px solid var(--border-soft);border-radius:8px;padding:14px 16px;font-size:13.5px;box-shadow:0 4px 12px rgb(0 0 0 / .1);animation:rise-in .2s ease-out both}
.toast.bad{color:var(--destructive);border-color:rgb(180 35 24 / .3)}

/* ---------- login (mirrors app/login + login-form) ---------- */
.login{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.login::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--brand)}
.login::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#111 0%,#111 28%,transparent 28%);opacity:.04;pointer-events:none}
.login .box{position:relative;z-index:1;width:100%;max-width:448px;border-radius:16px;padding:32px}
.login .login-logo{display:flex;justify-content:center;border-bottom:1px solid var(--border-soft);padding-bottom:20px;margin-bottom:20px}
.login .login-logo img{height:64px;width:auto;max-width:100%}
.login .form-err:empty{display:none}
.login .btn.lg{height:40px;width:100%;font-size:14px;font-weight:600}
.login h1{font-size:30px}
.login .sub{margin-top:8px;font-size:14px;color:var(--muted-fg)}
.login .sub a{color:#111;text-underline-offset:2px;text-decoration:none}
.login .sub a:hover{text-decoration:underline}
.login form{margin-top:24px;display:flex;flex-direction:column;gap:16px}
.login .f{margin:0}
.login .input{height:40px;background:rgb(255 255 255 / .7)}
.login .hint{font-size:12px;color:var(--muted-fg);background:var(--background);border:1px solid var(--border-soft);padding:8px 10px;border-radius:8px}

/* ---------- misc ---------- */
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:168px;height:168px;border:8px solid #fff;outline:1px solid var(--border-soft)}
.qr i{background:#fff}.qr i.b{background:#111}
.empty{padding:28px;text-align:center;color:var(--muted-fg)}
.att{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border-soft);border-radius:12px;background:#fff}
.att .t1{margin-top:4px;font-weight:500}
.att .t2{font-size:12px;color:var(--muted-fg)}
.logo-text{display:inline-block;font-family:var(--display);font-weight:700;font-size:20px;background:var(--brand);color:#111;padding:2px 10px;border-radius:4px}

/* ---------- switch (shadcn switch: yellow when on) ---------- */
.sw{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0;border-radius:999px;border:0;background:#d4d4d8;cursor:pointer;transition:background .15s;vertical-align:middle}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .2);transition:transform .15s}
.sw.on{background:var(--brand)}
.sw.on::after{transform:translateX(16px)}
.sw:focus-visible{outline:none;box-shadow:0 0 0 3px rgb(245 212 0 / .5)}
.sw:disabled{opacity:.5;cursor:not-allowed}
/* ---------- email preview (mirrors lib/email/send.ts emailShell) ---------- */
.mail{border:1px solid var(--border-soft);border-radius:8px;overflow:hidden;background:#f4f4f5}
.mail-meta{padding:8px 12px;border-bottom:1px solid var(--border-soft);background:#fff;font-size:12.5px;color:var(--muted-fg)}
.mail-in{background:#fff;margin:12px;padding:16px;border-radius:6px;font-family:Arial,sans-serif;color:#1a1f24;font-size:13.5px;line-height:1.5}
.mail-h{border-bottom:3px solid #1a1a1a;padding-bottom:12px;margin-bottom:14px}
.mail-h img{height:40px;width:auto;display:block}
.mail-h h4{font-family:Arial,sans-serif;font-size:18px;font-weight:700;letter-spacing:0;margin-top:8px}
.mail-b p{margin:0 0 10px}
.mail-att{display:inline-block;font-size:12.5px;background:#f4f4f5;border:1px solid var(--border-soft);border-radius:6px;padding:4px 10px}
.mail-f{margin-top:20px;font-size:11.5px;color:#5c6570}
.varchips{display:flex;flex-wrap:wrap;gap:0}
.varchips .chip{cursor:pointer;font-family:var(--mono);font-size:11px}
.varchips .chip:hover{border-color:var(--brand);background:rgb(245 212 0 / .12)}

/* ---------- clickable rows + side sheet (shadcn Sheet) ---------- */
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:focus-visible{outline:none}
.t tbody tr.click:focus-visible td{background:rgb(245 212 0 / .14)}
.ov.sheet{display:flex;justify-content:flex-end;align-items:stretch;padding:0}
.sheetp{width:min(480px,100%);height:100%;display:flex;flex-direction:column;background:#fff;box-shadow:-10px 0 40px rgb(0 0 0 / .15);animation:slide-in .2s ease-out both}
@keyframes slide-in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-top{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:var(--brand);color:#111;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.sheet-sec{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.02em;margin:18px 0 8px}
.sheet-sec:first-child{margin-top:0}

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind === "bad" ? " bad" : "");
  el.setAttribute("role", kind === "bad" ? "alert" : "status");
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3800);
}
function formErr(form, msg) { const e = form.querySelector(".form-err"); if (e) e.textContent = msg; else toast(msg, "bad"); return false; }
function closeOverlay() { document.getElementById("overlay").innerHTML = ""; UI.confirmFn = null; }

  document.getElementById("overlay").innerHTML = `
  <div class="ov" data-act="ovBg">

      <div class="drawer-h"><h2>${esc(title)}</h2>${sub ? `<div class="sub">${sub}</div>` : ""}

      <div class="drawer-b"><div class="form-err" role="alert"></div>${body}</div>
      <div class="drawer-f">${footer}</div>
    </form>
  </div>`;
  const first = document.querySelector("#overlay input:not([type=checkbox]):not([type=radio]):not([type=hidden]), #overlay select");
  if (first) first.focus();
}
function confirmBox(title, msg, yesLabel, fn, danger) {
  UI.confirmFn = fn;
  document.getElementById("overlay").innerHTML = `
  <div class="ov" data-act="ovBg"><div class="modal" role="alertdialog" aria-modal="true">
    <h3>${esc(title)}</h3><p>${msg}</p>
    <div class="acts" style="justify-content:flex-end">
      <button class="btn" data-act="close">Cancel</button>
      <button class="btn ${danger ? "danger" : "dark"}" data-act="confirmYes">${esc(yesLabel)}</button>
    </div></div></div>`;
}
function statusPill(active) { return active ? `<span class="pill ok">Active</span>` : `<span class="pill off">Inactive</span>`; }

/* ---------- parameter helpers ---------- */
const ovOf = oid => (oid && S.params.orgs[oid]) || {};
const pVal = (k, oid) => k in ovOf(oid) ? ovOf(oid)[k] : S.params.platform[k];
const isOv = (k, oid) => !!oid && k in ovOf(oid);
const ovCount = oid => Object.keys(ovOf(oid)).length;
const mask = v => v ? "••••••••" + String(v).slice(-4) : "";
const scopeOrg = () => UI.sc.mode === "org" && orgById(UI.sc.org) ? UI.sc.org : null;
function pShow(p, v) {
  if (p.type === "bool") return v ? `<span class="pill ok">On</span>` : `<span class="pill off">Off</span>`;
  if (v === "" || v == null) return `<span class="muted">Not set</span>`;
  if (p.type === "secret") return `<span class="secret">${esc(mask(v))}</span>`;
  if (p.type === "number") return `${Number(v).toLocaleString("en-AU")}${Number(v) === 0 && p.zero ? ` <span class="small muted">(${p.zero})</span>` : ""}`;
  return `<span class="${p.mono ? "mono" : ""}" style="word-break:break-all">${esc(v)}</span>`;
}

  PARAM_GROUPS.forEach(g => {
    if (!pVal(g.items[0].key, oid)) return;
    g.items.filter(p => p.req && !String(pVal(p.key, oid) ?? "").trim()).forEach(p => out.push({ g, p }));
  });
  return out;
}

/* ---------- email helpers (platform default + per-organization version) ---------- */
const evById = id => S.notify.events.find(e => e.id === id);
const evOvs = oid => (oid && S.notify.orgs[oid]) || {};
const evCustomCount = oid => Object.keys(evOvs(oid)).length;
function evEff(id, oid) {
  const b = evById(id), ov = evOvs(oid)[id];
  if (!ov) return { ...b, custom: false };
  const e = { ...b, ...ov, custom: true };
  if (ov.days != null && b.timing) e.timing = { ...b.timing, days: ov.days };
  delete e.days;
  return e;
}
function setEvOv(oid, id, patch) {
  const b = evById(id), all = S.notify.orgs[oid] || (S.notify.orgs[oid] = {});
  const ov = { ...(all[id] || {}), ...patch };
  const same = k => k === "days" ? !!b.timing && ov.days === b.timing.days
    : k === "recipients" ? JSON.stringify(ov.recipients) === JSON.stringify(b.recipients) : ov[k] === b[k];
  Object.keys(ov).forEach(k => { if (same(k)) delete ov[k]; });
  if (Object.keys(ov).length) all[id] = ov; else delete all[id];
  if (!Object.keys(all).length) delete S.notify.orgs[oid];
}
const whenText = e => e.timing ? `${e.timing.days} day${e.timing.days === 1 ? "" : "s"} ${e.timing.label}` : e.trigger;

/* ---------- attention items (dashboard + nav badges) ---------- */
function attentionItems() {
  const out = [];

  S.orgs.filter(o => o.active).forEach(o => {
    paramGaps(o.id).filter(x => !platKeys.has(x.p.key)).forEach(({ g, p }) =>
      out.push({ tone: "bad", title: `${o.name}: ${g.name} ${p.label} is empty`, hint: `${g.name} won't work for this organization`, kind: "param", go: ["parameters", o.id] }));  });
  S.orgs.filter(o => !o.active).forEach(o => out.push({ tone: "info", title: `${o.name} is inactive`, hint: "Its users can't sign in", act: "orgOpen", id: o.id }));
  return out;
}

function qr(seed) {
  let h = 0; for (const ch of seed) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (h = (h * 1103515245 + 12345) >>> 0) % 100;
  const finder = (r, c) => { for (const [fr, fc] of [[0, 0], [0, 14], [14, 0]]) { const y = r - fr, x = c - fc; if (y >= 0 && y < 7 && x >= 0 && x < 7) return (y === 0 || y === 6 || x === 0 || x === 6 || (y >= 2 && y <= 4 && x >= 2 && x <= 4)) ? 1 : 0; } return -1; };
  let cells = "";
  for (let r = 0; r < 21; r++) for (let c = 0; c < 21; c++) { const f = finder(r, c); cells += `<i class="${(f === -1 ? rnd() < 48 : f) ? "b" : ""}"></i>`; }
  return `<div class="qr" aria-label="QR code">${cells}</div>`;
}

const FORMS = {
  "f-login"(f, fd) {
    if (fd.get("email").trim().toLowerCase() !== S.me.email.toLowerCase() || fd.get("password") !== S.me.password) {
      S.me.history.unshift({ at: stamp(), ip: "203.0.113.24", device: "This browser", ok: false }); save();
      return formErr(f, "Invalid login credentials");
    }
    if (S.me.mfa) { UI.mfaPending = true; return render(); }
    signIn();
  },
  "f-mfa"(f, fd) { if (!/^\d{6}$/.test(fd.get("code"))) return formErr(f, "Enter the 6-digit code."); UI.mfaPending = false; signIn(); },
  "f-find"(f, fd) { UI.orgF = { q: String(fd.get("q") || "").trim(), status: "all" }; go("orgs"); },
  "f-org"(f, fd) {
    const id = f.dataset.id, g = k => (fd.get(k) || "").trim();
    const name = g("name"), code = g("code").toUpperCase(), address = g("address"), email = g("email");
    if (!name || !code || !address) return formErr(f, "Name, code and address are required.");
    if (!/^[A-Z]{2,5}$/.test(code)) return formErr(f, "Code must be 2–5 letters.");
    if (S.orgs.some(o => o.code === code && o.id !== id)) return formErr(f, `Code ${code} is already used by another organization.`);
    if (S.orgs.some(o => o.name.toLowerCase() === name.toLowerCase() && o.id !== id)) return formErr(f, `An organization called ${name} already exists.`);
    if (email && !emailOk(email)) return formErr(f, "Organization email doesn't look right.");
    const data = { name, code, state: g("state"), address, phone: g("phone"), email };
    if (id) { Object.assign(orgById(id), data); save(); closeOverlay(); render(); return toast(`${name} updated`); }
    const an = g("adminName"), ae = g("adminEmail").toLowerCase(), pw = fd.get("password") || "";
    if (!an || !ae) return formErr(f, "Admin name and email are required.");
    if (!emailOk(ae)) return formErr(f, "Admin email doesn't look right.");
    if (ae === S.me.email.toLowerCase() || S.orgs.some(o => o.admin.email.toLowerCase() === ae)) return formErr(f, `${ae} already has an account. Use a different email for this Admin.`);
    if (pw.length < 8) return formErr(f, "Temporary password must be at least 8 characters.");
    S.orgs.push({ id: uid("o_"), ...data, active: true, createdAt: today(), admin: { name: an, email: ae, phone: g("adminPhone") } });
    save(); closeOverlay(); render();
    toast(`${name} created. ${an} can sign in with the temporary password.`);
  },
  "f-priv"(f, fd) {
    const id = f.dataset.id, g = k => (fd.get(k) || "").trim();
    const label = g("label"), area = g("area"), type = g("type"), desc = g("desc");
    if (id) {
      if (!label || !area) return formErr(f, "What it allows and area are required.");
      Object.assign(privByCode(id), { label, area, type, desc }); save(); closeOverlay(); render(); return toast(`${label} updated`);
    }
    const code = g("code").toUpperCase();
    if (!code || !label || !area) return formErr(f, "Code, what it allows and area are required.");
    if (!/^[A-Z][A-Z0-9_]{2,39}$/.test(code)) return formErr(f, "Code must start with a letter and use only capital letters, numbers and _ (3–40 characters).");
    if (privByCode(code)) return formErr(f, `${code} already exists.`);
    S.privs.push({ code, label, type, area, desc, active: true, createdAt: today() });
    save(); closeOverlay(); render(); toast(`${code} created. Admins can now add it to their roles`);
  },
  "f-param"(f, fd) {
    const p = PARAM[f.dataset.k], oid = f.dataset.o || null, cur = pVal(p.key, oid);
    const raw = String(fd.get("val") ?? "").trim();
    let v;
    if (p.type === "bool") v = raw === "1";
    else if (p.type === "secret") v = raw || cur;
    else if (p.type === "number") {
      v = Number(raw);
      if (raw === "" || !Number.isInteger(v) || v < p.min || v > p.max) return formErr(f, `Enter a whole number from ${p.min.toLocaleString("en-AU")} to ${p.max.toLocaleString("en-AU")}.`);
    } else v = raw;
    if (p.req && (v === "" || v == null)) return formErr(f, `${p.label} is required.`);
    if (p.type === "url" && v && !/^https:\/\/\S+$/.test(v)) return formErr(f, "Use a full https:// address.");
    if (p.type === "email" && v && !emailOk(v)) return formErr(f, "That email address doesn't look right.");
    if (oid) {
      const ov = S.params.orgs[oid] || (S.params.orgs[oid] = {});
      if (v === S.params.platform[p.key]) delete ov[p.key]; else ov[p.key] = v;
      if (!Object.keys(ov).length) delete S.params.orgs[oid];
    } else S.params.platform[p.key] = v;
    save(); closeOverlay(); render(); toast(`${p.label} saved ${oid ? `for ${orgById(oid).name}` : "for the platform"}`);
  },
  "f-notif"(f, fd) {
    const b = evById(f.dataset.id), oid = f.dataset.o || null;
    const subject = (fd.get("subject") || "").trim(), body = (fd.get("body") || "").trim(), recipients = fd.getAll("rcpt");
    if (!subject || !body) return formErr(f, "Subject and body are required.");
    if (!recipients.length) return formErr(f, "Pick at least one person to send to.");
    let days;
    if (b.timing) { days = Number(fd.get("days")); if (!(Number.isInteger(days) && days >= 1 && days <= 90)) return formErr(f, "Days must be a whole number from 1 to 90."); }
    if (oid) {
      setEvOv(oid, b.id, { subject, body, recipients, ...(b.timing ? { days } : {}), ...(b.modeOptions ? { mode: fd.get("mode") } : {}) });
    } else {
      Object.assign(b, { subject, body, recipients, adminCanOff: fd.get("adminCanOff") === "on" });
      if (b.timing) b.timing.days = days;
      if (b.modeOptions) b.mode = fd.get("mode");
    }
    save(); closeOverlay(); render(); toast(`“${b.name}” saved${oid ? ` for ${orgById(oid).name}` : ""}`);
  },
  "f-profile"(f, fd) {
    const name = (fd.get("name") || "").trim(); if (!name) return formErr(f, "Display name is required.");
    S.me.name = name; S.me.mobile = (fd.get("mobile") || "").trim(); save(); render(); toast("Profile saved");
  },
  "f-password"(f, fd) {
    if (fd.get("cur") !== S.me.password) return formErr(f, "Current password is incorrect.");
    const nw = fd.get("nw"); if (nw.length < 8) return formErr(f, "New password must be at least 8 characters.");
    if (nw !== fd.get("cf")) return formErr(f, "New passwords don't match.");
    S.me.password = nw; save(); f.reset(); f.querySelector(".form-err").textContent = ""; toast("Password updated");
  },
  "f-mfa-setup"(f, fd) {
    if (!/^\d{6}$/.test(fd.get("code"))) return formErr(f, "Enter the 6-digit code from the app.");
    S.me.mfa = true; UI.mfaSetup = null; save(); render(); toast("Two-step sign-in is on");
  },
};
function stamp() { const d = new Date(); return `${d.toISOString().slice(0, 10)} ${d.toTimeString().slice(0, 5)}`; }
function go(route) { if (location.hash.slice(1) === route) { UI.route = route; render(); } else location.hash = route; }
function applyHash() {
  const r = (location.hash.slice(1) || "dashboard").split("/")[0];
  if (!VIEWS[r]) return false;
  UI.route = r;
  return true;
}
function signIn() {
  UI.authed = true;
  if (!applyHash()) UI.route = "dashboard";
  S.me.history.unshift({ at: stamp(), ip: "203.0.113.24", device: "This browser", ok: true });
  S.me.lastLogin = "Just now"; save(); render();
}

/* ---------- click actions ---------- */
const ACTS = {
  logout() { UI.authed = false; render(); },
  cancelMfa() { UI.mfaPending = false; render(); },
  close: closeOverlay,
  ovBg(el, e) { if (e.target === el) closeOverlay(); },
  confirmYes() { const fn = UI.confirmFn; if (fn) fn(); },
  orgNew() { orgForm(null); },
  orgEdit(el) { orgForm(orgById(el.dataset.id)); },
  orgOpen(el) { orgSheet(orgById(el.dataset.id)); },
  orgToggle(el) {
    const o = orgById(el.dataset.id);
    if (!o.active) { o.active = true; save(); closeOverlay(); render(); return toast(`${o.name} activated`); }
    confirmBox(`Deactivate ${o.name}?`, "Everyone in this organization, including its Admin, is signed out and can't sign in. Its data is kept and comes back if you activate it again.", "Deactivate", () => {
      o.active = false; save(); closeOverlay(); render(); toast(`${o.name} deactivated`);
    }, true);
  },
  orgAdminReset(el) { const o = orgById(el.dataset.id); toast(`Password reset link sent to ${o.admin.email}`); },
  orgGo(el) {
    closeOverlay();
    UI.sc = el.dataset.id ? { mode: "org", org: el.dataset.id } : { mode: "platform", org: "" };
    go(el.dataset.r);
  },
  privNew() { privForm(null); },
  privEdit(el) { privForm(privByCode(el.dataset.id)); },
  privOpen(el) { privSheet(privByCode(el.dataset.id)); },
  privType(el) { UI.privF.type = el.dataset.v; render(); },
  privToggle(el) {
    const p = privByCode(el.dataset.id);
    if (!p.active) { p.active = true; save(); closeOverlay(); render(); return toast(`${p.code} is active again`); }
    confirmBox(`Deactivate ${p.code}?`, "Admins can no longer add it to roles, and anyone whose role includes it loses it straight away, in every organization. You can activate it again later.", "Deactivate", () => {
      p.active = false; save(); closeOverlay(); render(); toast(`${p.code} deactivated`);
    }, true);
  },
  scMode(el) { UI.sc.mode = el.dataset.v; render(); if (UI.sc.mode === "org" && !scopeOrg()) document.getElementById("sc-org")?.focus(); },
  pEdit(el) { paramForm(el.dataset.k); },
  pReset(el) {
    const oid = scopeOrg(), p = PARAM[el.dataset.k]; if (!oid) return;
    delete S.params.orgs[oid][p.key]; if (!ovCount(oid)) delete S.params.orgs[oid];
    save(); closeOverlay(); render(); toast(`${orgById(oid).name} now uses the platform ${p.label}`);
  },
  pTest(el) {
    const g = groupById(el.dataset.g), oid = scopeOrg(), o = oid && orgById(oid), who = o ? ` for ${o.name}` : "";
    if (!pVal(g.items[0].key, oid)) return toast(`${g.name} is off${who}. Turn it on first.`, "bad");
    const miss = paramGaps(oid).filter(x => x.g.id === g.id).map(x => x.p.label);
    if (miss.length) return toast(`Can't connect to ${g.name}${who}: ${miss.join(", ")} ${miss.length > 1 ? "are" : "is"} empty.`, "bad");
    toast(`Connected to ${g.name}${who}`);
  },
  mfaStart() { UI.mfaSetup = Array.from({ length: 16 }, () => "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567"[Math.floor(Math.random() * 32)]).join("").replace(/(.{4})/g, "$1 ").trim(); render(); },
  mfaCancel() { UI.mfaSetup = null; render(); },
  mfaOff() { confirmBox("Turn off two-step sign-in?", "Your account will be protected by password only.", "Turn off", () => { S.me.mfa = false; save(); closeOverlay(); render(); toast("Two-step sign-in is off"); }, true); },
  notifToggle(el) {
    const oid = scopeOrg(), b = evById(el.dataset.id), e = evEff(b.id, oid);
    if (oid) setEvOv(oid, b.id, { enabled: !e.enabled }); else b.enabled = !b.enabled;
    save(); render(); toast(`“${b.name}” turned ${e.enabled ? "off" : "on"}${oid ? ` for ${orgById(oid).name}` : ""}`);
  },
  notifEdit(el) { notifForm(el.dataset.id); },
  nReset(el) {
    const oid = scopeOrg(); if (!oid) return;
    delete S.notify.orgs[oid][el.dataset.id]; if (!evCustomCount(oid)) delete S.notify.orgs[oid];
    save(); closeOverlay(); render(); toast(`${orgById(oid).name} now uses the platform “${evById(el.dataset.id).name}”`);
  },
  insVar(el) {
    const f = document.getElementById("f-notif"); if (!f) return;
    let t = UI.lastField; if (!t || !f.contains(t)) t = f.querySelector("[name=body]");
    const s = t.selectionStart ?? t.value.length, en = t.selectionEnd ?? s;
    t.value = t.value.slice(0, s) + el.dataset.v + t.value.slice(en);
    t.focus(); const p = s + el.dataset.v.length; t.setSelectionRange(p, p); renderPreview();
  },
  testSend() { toast(`Test email sent to ${S.me.email}`); },
};

/* ---------- event wiring ---------- */
document.addEventListener("click", e => {
  const seg = e.target.closest("[data-seg] button");
  if (seg) {
    const wrap = seg.parentElement, form = seg.closest("form");
    wrap.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === seg));
    form.querySelector(`input[name=${wrap.dataset.seg}]`).value = seg.dataset.v;    return;
  }
  const el = e.target.closest("[data-act]");
  if (el && ACTS[el.dataset.act]) {
    if (el.dataset.act === "ovBg" && e.target !== el) return;
    e.preventDefault(); ACTS[el.dataset.act](el, e);
  }
});
document.addEventListener("submit", e => { const f = e.target; if (FORMS[f.id]) { e.preventDefault(); FORMS[f.id](f, new FormData(f)); } });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.filter && t.tagName === "INPUT") { const [obj, key] = t.dataset.filter.split("."); UI[obj][key] = t.value; const pos = t.selectionStart; render();
    const again = document.querySelector(`[data-filter="${t.dataset.filter}"]`); if (again) { again.focus(); again.setSelectionRange(pos, pos); } return; }
  if (t.closest("#f-notif")) renderPreview();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.tagName === "SELECT" && t.dataset.filter) { const [obj, key] = t.dataset.filter.split("."); UI[obj][key] = t.value; render(); return; }
  if (t.dataset.live !== undefined) { t.closest(".check")?.classList.toggle("on", t.checked); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.getElementById("overlay").innerHTML) return closeOverlay();
  const tr = e.target.closest && e.target.closest("tr.click");
  if (tr && e.target === tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); ACTS[tr.dataset.act](tr, e); }
});
window.addEventListener("hashchange", () => {
  if (UI.authed && applyHash()) { render(); window.scrollTo(0, 0); }
});
document.addEventListener("focusin", e => { if (e.target.matches && e.target.matches("[data-var-target]")) UI.lastField = e.target; });

render();
</script>
</body>
